<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>psyq-wasm demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>psyq-wasm</h1>
      <p>
        PsyQ 4.4 <code>cc1psx</code> (GCC 2.8.1, <code>mips-psx</code>) running as WebAssembly in
        this page. Paste <em>preprocessed</em> C and compile; nothing leaves your browser.
      </p>
    </header>

    <main>
      <section class="pane">
        <label for="source">Preprocessed C (<code>.i</code>)</label>
        <textarea id="source" spellcheck="false"></textarea>
        <div class="controls">
          <fieldset>
            <legend>Small data (<code>-G</code>)</legend>
            <label><input type="radio" name="gp" value="8" checked /> 8</label>
            <label><input type="radio" name="gp" value="0" /> 0</label>
          </fieldset>
          <label class="flags">
            Flags
            <input id="flags" type="text" value="-O2 -g0 -Wall" spellcheck="false" />
          </label>
          <label class="flags">
            Filename
            <input id="filename" type="text" value="input.i" spellcheck="false" />
          </label>
          <button id="compile" type="button" disabled>Compile</button>
          <button id="cancel" type="button" disabled>Cancel</button>
        </div>
      </section>

      <section class="pane">
        <label for="output">Assembly (<code>.s</code>)</label>
        <pre id="output" tabindex="0"></pre>
        <div id="diagnostics" class="diagnostics"></div>
      </section>
    </main>

    <footer>
      <span id="status">loading compiler…</span>
      <span id="timings"></span>
      <span id="build"></span>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
