name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: node scripts/verify-provenance.mjs
      - name: Encoder table matches Ruby's EUC-JP converter
        run: ruby scripts/gen-eucjp-table.rb --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build-wasm:
    name: Build cc1psx.wasm and cccp.wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned sources and Emscripten system libraries
        uses: actions/cache@v4
        with:
          path: |
            build/vendor
            build/out/emcache
          key: wasm-inputs-${{ hashFiles('build/pins.env', 'build/*.txt', 'build/*.sh', 'build/patches/**', 'build/gen/**') }}
      - run: npm run build:wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            dist/cc1psx.wasm
            dist/cc1psx.js
            dist/cccp.wasm
            dist/cccp.js
            dist/build-info.json
            dist/SHA256SUMS
          if-no-files-found: error

  node:
    name: Node ${{ matrix.node }} integration (${{ matrix.os }})
    needs: build-wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: dist
      - run: npm run build:ts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:node
      - run: npm run test:package -- --skip-vite

  browser:
    name: Browser tests (Chromium, Firefox, WebKit)
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: dist
      - run: npm run build:ts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  package:
    name: npm pack and consumer smoke tests
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: dist
      - run: npm run build:ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:package
