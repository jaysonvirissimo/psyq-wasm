name: Reference drift

# The fixtures and build/gen are generated by the historical reference compiler,
# which takes a full build in the pinned 1999 container -- far too slow to run on
# every pull request. Until this job existed the check ran only on tags, so drift
# was first discovered mid-release. Weekly is early enough to fix it calmly.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Fresh reference vs committed generated sources and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Fresh reference regeneration and fixture verification
        run: |
          mkdir -p build/out
          reference=$(mktemp -d "$PWD/build/out/reference-scheduled.XXXXXX")
          build/build-reference.sh "$reference"
          build/check-gen.sh "$reference"
          build/compile-fixtures.sh --verify "$reference"
