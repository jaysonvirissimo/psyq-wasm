version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # vitest and its plugins pin each other exactly; they must move together.
      vitest:
        patterns: ['vitest', '@vitest/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint peers on typescript <6.1; lift once it supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # upload-artifact and download-artifact majors are not cross-compatible;
      # nothing here benefits from a solo PR.
      actions:
        patterns: ['*']
